<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="1040" height="800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <rect width="1040" height="800" fill="#ffffff"/>

  <text x="520" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#1a1d21">Arquitetura do Bot de Agendamento</text>
  <text x="520" y="63" text-anchor="middle" font-size="13" fill="#6b7280">WhatsApp · Evolution API · n8n · OpenAI · Redis · Google Workspace</text>

  <!-- ENTRADA -->
  <text x="60" y="105" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1.2">ENTRADA</text>
  <rect x="60" y="115" width="180" height="52" rx="8" fill="#f0fdf4" stroke="#25D366" stroke-width="1.6"/>
  <text x="150" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">WhatsApp</text>
  <text x="150" y="157" text-anchor="middle" font-size="11" fill="#4b7a5a">mensagem do paciente</text>

  <line x1="248" y1="141" x2="322" y2="141" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="330" y="115" width="180" height="52" rx="8" fill="#f0fdf4" stroke="#25D366" stroke-width="1.6"/>
  <text x="420" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Evolution API</text>
  <text x="420" y="157" text-anchor="middle" font-size="11" fill="#4b7a5a">ponte com o WhatsApp</text>

  <line x1="518" y1="141" x2="592" y2="141" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="600" y="115" width="180" height="52" rx="8" fill="#fef2f5" stroke="#EA4B71" stroke-width="1.6"/>
  <text x="690" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#9f1239">Webhook</text>
  <text x="690" y="157" text-anchor="middle" font-size="11" fill="#a8546a">entrada do fluxo n8n</text>

  <path d="M 690 175 L 690 200" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- CLASSIFICACAO -->
  <text x="60" y="222" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1.2">CLASSIFICAÇÃO</text>
  <rect x="380" y="208" width="280" height="44" rx="8" fill="#fef2f5" stroke="#EA4B71" stroke-width="1.6"/>
  <text x="520" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#9f1239">Switch — tipo da mensagem</text>

  <path d="M 460 252 L 460 270 L 175 270 L 175 292" fill="none" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M 520 252 L 520 292" fill="none" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M 580 252 L 580 270 L 865 270 L 865 292" fill="none" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="70" y="300" width="210" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="175" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Texto</text>
  <text x="175" y="345" text-anchor="middle" font-size="11" fill="#64748b">segue direto para o fluxo</text>

  <rect x="415" y="300" width="210" height="70" rx="8" fill="#ecfdf5" stroke="#10A37F" stroke-width="1.6"/>
  <text x="520" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Áudio</text>
  <text x="520" y="345" text-anchor="middle" font-size="11" fill="#3f8873">transcrição via OpenAI</text>

  <rect x="760" y="300" width="210" height="70" rx="8" fill="#ecfdf5" stroke="#10A37F" stroke-width="1.6"/>
  <text x="865" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Imagem</text>
  <text x="865" y="345" text-anchor="middle" font-size="11" fill="#3f8873">leitura via OpenAI Vision</text>

  <path d="M 175 370 L 175 392 L 520 392 L 520 412" fill="none" stroke="#8a8f98" stroke-width="1.6"/>
  <path d="M 520 370 L 520 412" fill="none" stroke="#8a8f98" stroke-width="1.6"/>
  <path d="M 865 370 L 865 392 L 520 392" fill="none" stroke="#8a8f98" stroke-width="1.6"/>
  <path d="M 520 392 L 520 420" fill="none" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ESTADO -->
  <text x="60" y="450" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1.2">ESTADO</text>
  <rect x="290" y="428" width="460" height="62" rx="8" fill="#fef2f2" stroke="#DC382D" stroke-width="1.6"/>
  <text x="520" y="452" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Redis</text>
  <text x="520" y="472" text-anchor="middle" font-size="11" fill="#a35b56">debounce de mensagens · estado da conversa · memória do chat</text>

  <path d="M 520 498 L 520 522" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- INTELIGENCIA -->
  <text x="60" y="552" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="1.2">INTELIGÊNCIA</text>
  <rect x="290" y="530" width="460" height="56" rx="8" fill="#ecfdf5" stroke="#10A37F" stroke-width="1.6"/>
  <text x="520" y="553" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">LLM extrator</text>
  <text x="520" y="572" text-anchor="middle" font-size="11" fill="#3f8873">monta a ficha do paciente a partir da conversa</text>

  <path d="M 520 594 L 520 616" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="290" y="624" width="460" height="56" rx="8" fill="#ecfdf5" stroke="#10A37F" stroke-width="2.2"/>
  <text x="520" y="647" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">AI Agent</text>
  <text x="520" y="666" text-anchor="middle" font-size="11" fill="#3f8873">decide a resposta e aciona as ferramentas</text>

  <path d="M 380 680 L 380 700 L 175 700 L 175 718" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M 520 680 L 520 718" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M 660 680 L 660 700 L 865 700 L 865 718" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect x="70" y="726" width="210" height="54" rx="8" fill="#eff6ff" stroke="#4285F4" stroke-width="1.6"/>
  <text x="175" y="748" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">Google Calendar</text>
  <text x="175" y="766" text-anchor="middle" font-size="10.5" fill="#5878b8">via MCP · criar, buscar, remarcar</text>

  <rect x="415" y="726" width="210" height="54" rx="8" fill="#eff6ff" stroke="#4285F4" stroke-width="1.6"/>
  <text x="520" y="748" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">Google Sheets</text>
  <text x="520" y="766" text-anchor="middle" font-size="10.5" fill="#5878b8">cadastro dos pacientes</text>

  <rect x="760" y="726" width="210" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="865" y="748" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Transbordo humano</text>
  <text x="865" y="766" text-anchor="middle" font-size="10.5" fill="#b07a3a">pausa o bot para a secretária</text>

  <!-- RETORNO -->
  <path d="M 750 652 L 990 652 L 990 141 L 788 141" fill="none" stroke="#25D366" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="1000" y="400" text-anchor="middle" font-size="11" font-weight="600" fill="#166534" transform="rotate(-90 1000 400)">resposta ao paciente</text>
</svg>
